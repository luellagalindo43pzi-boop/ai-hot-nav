name: AI Hot Nav — crawl and digest

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '日报主题（示例：AI Agent 与开源框架）'
        required: false
        default: 'AI'
        type: string
      days:
        description: '联网搜索回看天数'
        required: false
        default: '2'
        type: string
  schedule:
    - cron: '17 */6 * * *' # UTC; spread away from the hour boundary

permissions:
  contents: write

concurrency:
  group: automated-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: python -m pip install --upgrade pip requests feedparser
      - name: Crawl, review, merge and generate digest
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_KEY_AGNES: ${{ secrets.MODEL_API_KEY_AGNES }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DIGEST_TOPIC: ${{ inputs.topic || 'AI' }}
          DIGEST_DAYS: ${{ inputs.days || '2' }}
        run: python3 engine/run.py all
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sites.json data/stats.json data/digest.json data/digests data/new_items.json data/candidates.json data/crawler_status.json data/seen_links.json js/data.js
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): refresh crawl and AI digest [skip ci]"
            # The site/docs may be updated while a crawl is running. Rebase its data-only commit before pushing.
            git pull --rebase origin main
            git push
          fi
